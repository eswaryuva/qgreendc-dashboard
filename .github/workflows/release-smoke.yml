name: Experiment 5 - Published website browser verification

on:
  push:
    branches:
      - test/chat-gpt-git-html
    paths:
      - '.github/workflows/release-smoke.yml'
      - 'vue-experiment4-src/e2e/live-smoke.mjs'

permissions:
  contents: read

jobs:
  live-browser:
    name: Verify both published apps in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: vue-experiment4-src
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        working-directory: vue-experiment4-src
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test against published GitHub Pages
        working-directory: vue-experiment4-src
        run: node e2e/live-smoke.mjs
